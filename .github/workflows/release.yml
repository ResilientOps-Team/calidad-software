name: Release y despliegue

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Versionado, tag, release y artefactos
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      version: ${{ steps.semrel.outputs.version }}
    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      # Se publica exactamente el commit que validó el CI
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configurar pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.14.0

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Ejecutar semantic-release
        id: semrel
        run: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
          APP_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}

      - name: Sin release nuevo
        if: steps.semrel.outputs.version == ''
        run: echo "::notice::No hay commits feat/fix/perf desde el último tag; no se publica versión ni se despliega"

      - name: Preparar el sitio para GitHub Pages
        if: steps.semrel.outputs.version != ''
        uses: actions/upload-pages-artifact@v5
        with:
          path: out/

  deploy:
    name: Despliegue en entorno de pruebas (GitHub Pages)
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v5

  validate:
    name: Validaciones posteriores al despliegue
    needs: [release, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verificar el sitio desplegado
        run: node scripts/post-deploy-check.mjs "$PAGE_URL" --version "$VERSION"
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          VERSION: ${{ needs.release.outputs.version }}
